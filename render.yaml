services:
  - type: web
    name: praxis-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@9 install --frozen-lockfile --prod=false && npx --yes pnpm@9 --filter @praxis/api build
    startCommand: npx --yes pnpm@9 --filter @praxis/api db:migrate && node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WORKER_HEARTBEAT_KEY
        value: praxis:worker:heartbeat
      - key: WORKER_HEARTBEAT_TTL_SECONDS
        value: 30
      - key: SUBMISSION_EXPIRY_HOURS
        value: 6
      - key: SUBMISSION_RATE_LIMIT_PER_HOUR
        value: 5
      - key: WORKER_CONCURRENCY
        value: 2
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: E2B_API_KEY
        sync: false
